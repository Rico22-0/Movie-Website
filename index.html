<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePulse - Discover Movies & TV Shows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">Cine<span>Pulse</span></a>
            
            <nav class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#trending">Trending</a>
                <a href="#watchlist" id="watchlist-link">Watchlist</a>
            </nav>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search movies...">
                <button id="search-btn" aria-label="Search">🔍</button>
            </div>
        </div>
    </header>

    <main>

        <section class="hero" id="hero">
            <div class="hero-content">
                <span class="hero-badge">Trending Today</span>
                <h1 id="hero-title">Loading Featured Movie...</h1>
                <p id="hero-overview">Grab some popcorn. We are fetching the hottest movie of the day for you right now.</p>
                <div class="hero-buttons">
                    <button class="btn primary-btn" id="hero-details-btn">More Info</button>
                    <button class="btn secondary-btn" id="hero-trailer-btn">Watch Trailer</button>
                </div>
            </div>
        </section>

        
        <section class="movie-section" id="trending">
            <div class="section-header">
                <h2> Trending Movies</h2>
            </div>
            <!-- Dynamic JavaScript will inject movie cards inside this grid -->
            <div class="movie-grid" id="movie-grid">
                
            </div>
        </section>

    </main>

    
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 CinePulse. All rights reserved.</p>
            <p class="api-credit">Powered by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB API</a></p>
        </div>
    </footer>

    <!-- Link to your JavaScript file -->
    <script src="js/api.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
